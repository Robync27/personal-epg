name: Update personal EPG

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/update-epg.yml'
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: personal-epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout personal EPG
        uses: actions/checkout@v4

      - name: Checkout upstream EPG tools
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci

      - name: Select channels
        run: python3 scripts/select_channels.py config/channels.json upstream work/channels

      - name: Grab US guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/us.channels.xml --output=../work/us.xml --days=2 --maxConnections=10

      - name: Grab Canada guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/ca.channels.xml --output=../work/ca.xml --days=2 --maxConnections=10

      - name: Grab UK guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/uk.channels.xml --output=../work/uk.xml --days=2 --maxConnections=10

      - name: Grab supplemental guides
        working-directory: upstream
        shell: bash
        run: |
          mkdir -p ../work/supplemental
          for source in tvpassport tvguide directv tvinsider tvhebdo mytelly tv24 freeview; do
            echo "Supplemental EPG: $source"
            if npm run grab -- --channels="../work/channels/$source.channels.xml" --output="../work/supplemental/$source.xml" --days=2 --maxConnections=5; then
              echo "$source: completed"
            else
              echo "::warning::$source failed; preserving primary EPG and continuing"
              rm -f "../work/supplemental/$source.xml"
            fi
          done

      - name: Merge and compress XMLTV
        run: |
          mkdir -p public
          python3 scripts/merge_xmltv.py public/epg.xml work/us.xml work/ca.xml work/uk.xml work/supplemental/*.xml
          gzip -9 -c public/epg.xml > public/epg.xml.gz
          cp public/epg.xml.gz Canada_EPG.xml.gz
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('public/epg.xml').getroot()
          print('channels=', len(root.findall('channel')), 'programmes=', len(root.findall('programme')))
          assert root.tag == 'tv'
          assert root.findall('channel')
          assert root.findall('programme')
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          def starts_in_future(p):
            try:
              raw = p.get('start','')
              return datetime.strptime(raw[:14], '%Y%m%d%H%M%S') >= (now.replace(tzinfo=None) - timedelta(hours=12))
            except ValueError:
              return False
          assert any(starts_in_future(p) for p in root.findall('programme')), 'No current or future listings: refusing to publish stale guide'
          for label in ('HBO', 'Cinemax', 'MoreMAX'):
            matches = [ch.get('id','') for ch in root.findall('channel') if label.casefold() in ' '.join(x.text or '' for x in ch.findall('display-name')).casefold()]
            print(f'{label} channel IDs: {matches}')
          PY

      - name: Publish updated guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'personal-epg-bot'
          git config user.email 'actions@users.noreply.github.com'

          # Keep the validated output intact when syncing with new commits.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp public/epg.xml public/epg.xml.gz Canada_EPG.xml.gz "$tmp/"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public
            cp "$tmp/epg.xml" public/epg.xml
            cp "$tmp/epg.xml.gz" public/epg.xml.gz
            cp "$tmp/Canada_EPG.xml.gz" Canada_EPG.xml.gz
            git add public/epg.xml public/epg.xml.gz Canada_EPG.xml.gz
            if git diff --cached --quiet; then
              echo 'EPG already published.'
              exit 0
            fi
            git commit -m 'Update EPG data'
            if git push origin HEAD:main; then
              echo 'EPG published successfully.'
              exit 0
            fi
            echo "Push conflict on attempt $attempt; retrying."
            sleep 3
          done
          echo 'EPG publication failed after 3 attempts.' >&2
          exit 1
