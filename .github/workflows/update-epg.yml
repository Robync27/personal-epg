name: Update personal EPG

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/update-epg.yml'
  schedule:
    - cron: '0 2 * * *'
      timezone: 'America/Toronto'

permissions:
  contents: write

concurrency:
  group: personal-epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout personal EPG
        uses: actions/checkout@v4

      - name: Checkout upstream EPG tools
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/package-lock.json

      - name: Install upstream dependencies
        working-directory: upstream
        run: npm ci

      - name: Select channels
        run: python3 scripts/select_channels.py config/channels.json upstream work/channels

      - name: Grab US guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/us.channels.xml --output=../work/us.xml --days=7 --maxConnections=3

      - name: Grab Canada guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/ca.channels.xml --output=../work/ca.xml --days=7 --maxConnections=3

      - name: Grab UK guide
        working-directory: upstream
        run: npm run grab -- --channels=../work/channels/uk.channels.xml --output=../work/uk.xml --days=7 --maxConnections=3

      - name: Merge and compress XMLTV
        run: |
          mkdir -p public
          python3 scripts/merge_xmltv.py public/epg.xml work/us.xml work/ca.xml work/uk.xml
          gzip -9 -c public/epg.xml > public/epg.xml.gz
          cp public/epg.xml.gz Canada_EPG.xml.gz
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('public/epg.xml').getroot()
          print('channels=', len(root.findall('channel')), 'programmes=', len(root.findall('programme')))
          assert root.tag == 'tv'
          assert root.findall('channel')
          assert root.findall('programme')
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          def starts_in_future(p):
            try:
              raw = p.get('start','')
              return datetime.strptime(raw[:14], '%Y%m%d%H%M%S') >= (now.replace(tzinfo=None) - timedelta(hours=12))
            except ValueError:
              return False
          assert any(starts_in_future(p) for p in root.findall('programme')), 'No current or future listings: refusing to publish stale guide'
          for label in ('HBO', 'Cinemax', 'MoreMAX'):
            matches = [ch.get('id','') for ch in root.findall('channel') if label.casefold() in ' '.join(x.text or '' for x in ch.findall('display-name')).casefold()]
            print(f'{label} channel IDs: {matches}')
          PY

      - name: Guard against loss of guide coverage
        run: |
          python3 - <<'PY'
          import collections
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          import xml.etree.ElementTree as ET

          candidate = ET.parse('public/epg.xml').getroot()
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=6)
          def profile(root):
              channels = {c.get('id') for c in root.findall('channel') if c.get('id')}
              valid = collections.Counter()
              for p in root.findall('programme'):
                  cid = p.get('channel')
                  start = p.get('start', '')
                  try:
                      when = datetime.strptime(start[:14], '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue
                  # Timestamps are in each listing's local offset; the guard uses
                  # counts of total programmes independently of this freshness sample.
                  if cid and cid in channels and when >= cutoff:
                      valid[cid] += 1
              return len(channels), len(root.findall('programme')), len(valid)
          new = profile(candidate)
          print('Candidate: channels, programmes, approximate active channels:', new)
          if new[0] < 20 or new[1] < 500 or new[2] < 15:
              raise SystemExit('Refusing to publish severely incomplete guide')
          previous_path = Path('public/previous-epg.xml')
          # Compare against the guide committed at the beginning of the job.
          import subprocess
          previous = subprocess.run(['git', 'show', 'HEAD:public/epg.xml'], capture_output=True)
          if previous.returncode == 0 and previous.stdout:
              old = profile(ET.fromstring(previous.stdout))
              print('Previously published:', old)
              if old[0] >= 20 and (new[0] < old[0]*0.65 or new[1] < old[1]*0.50 or new[2] < old[2]*0.60):
                  raise SystemExit('Refusing to replace EPG: major coverage regression')
          PY

      - name: Report channel schedule coverage
        run: python3 scripts/report_coverage.py public/epg.xml public/coverage.json

      - name: Publish updated guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'personal-epg-bot'
          git config user.email 'actions@users.noreply.github.com'

          # Preserve the validated generated output while bringing the
          # checkout up to the newest main commit (including workflow edits).
          artifacts_dir="$(mktemp -d)"
          trap 'rm -rf "$artifacts_dir"' EXIT
          cp public/epg.xml public/epg.xml.gz public/coverage.json Canada_EPG.xml.gz "$artifacts_dir/"

          for attempt in 1 2 3 4; do
            echo "Publish attempt $attempt of 4"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p public
            cp "$artifacts_dir/epg.xml" public/epg.xml
            cp "$artifacts_dir/epg.xml.gz" public/epg.xml.gz
            cp "$artifacts_dir/coverage.json" public/coverage.json
            cp "$artifacts_dir/Canada_EPG.xml.gz" Canada_EPG.xml.gz
            git add public/epg.xml public/epg.xml.gz public/coverage.json Canada_EPG.xml.gz

            if git diff --cached --quiet; then
              echo 'EPG already matches published guide.'
              exit 0
            fi

            git commit -m 'Update EPG data'
            if git push origin HEAD:main; then
              echo 'Successfully published latest EPG.'
              exit 0
            fi
            echo 'Another change reached main during publishing; retrying.'
            sleep 3
          done

          echo 'Unable to publish EPG after 4 attempts.' >&2
          exit 1
